name: Check contact delivery
on:
  workflow_dispatch:
    inputs:
      submit_test:
        description: Send one clearly identified test enquiry to the website owner
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate the service documentation, privacy link and browser CORS
        shell: python
        run: |
          import json, urllib.request, urllib.error, re
          from html.parser import HTMLParser
          class Text(HTMLParser):
              def __init__(self):
                  super().__init__(); self.parts = []; self.hidden = 0
              def handle_starttag(self, tag, attrs):
                  if tag in ['script', 'style']: self.hidden += 1
              def handle_endtag(self, tag):
                  if tag in ['script', 'style']: self.hidden -= 1
              def handle_data(self, data):
                  if not self.hidden: self.parts.append(data)
          evidence = {}
          for label, url in [('docs', 'https://formsubmit.co/'), ('privacy', 'https://formsubmit.co/privacy.pdf')]:
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'SecurityByDesign/1.0', 'Accept': 'text/html,application/pdf'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      evidence[label + '_status'] = response.status
                      if label == 'docs':
                          parser = Text(); parser.feed(response.read().decode('utf-8', errors='replace'))
                          text = re.sub(r'\s+', ' ', ' '.join(parser.parts))
                          evidence['documentation'] = []
                          for phrase in ['Activate', 'AJAX', '_honey', '_captcha']:
                              match = re.search(phrase, text, re.IGNORECASE)
                              if match: evidence['documentation'].append(text[max(0,match.start()-80):match.end()+350])
              except urllib.error.HTTPError as error:
                  evidence[label + '_status'] = error.code
              except Exception as error:
                  evidence[label + '_error'] = type(error).__name__ + ': ' + str(error)[:180]
          request = urllib.request.Request('https://formsubmit.co/ajax/shlomovs@gmail.com', method='OPTIONS', headers={
              'Origin': 'https://sergeyshlomov.github.io', 'Access-Control-Request-Method': 'POST',
              'Access-Control-Request-Headers': 'content-type',
              'User-Agent': 'SecurityByDesign/1.0', 'Referer': 'https://sergeyshlomov.github.io/SecurityByDesign/',
          })
          try:
              response = urllib.request.urlopen(request, timeout=30)
          except urllib.error.HTTPError as error:
              response = error
          except Exception as error:
              response = None
              evidence['cors_error'] = type(error).__name__ + ': ' + str(error)[:180]
          if response:
              with response:
                  evidence['cors_status'] = response.status
                  evidence['allow_origin'] = response.headers.get('Access-Control-Allow-Origin')
                  evidence['allow_methods'] = response.headers.get('Access-Control-Allow-Methods')
                  evidence['allow_headers'] = response.headers.get('Access-Control-Allow-Headers')
          print('::notice::Service checks ' + json.dumps(evidence).replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
          if evidence.get('docs_status') != 200 or evidence.get('privacy_status') != 200:
              raise SystemExit(1)
      - name: Check the contact service and send one setup enquiry
        if: ${{ inputs.submit_test }}
        shell: python
        run: |
          import json, os, urllib.request, urllib.error
          origin = 'https://sergeyshlomov.github.io'
          endpoint = 'https://formsubmit.co/ajax/shlomovs@gmail.com'
          payload = {
              'name': 'SecurityByDesign delivery check',
              'email': 'shlomovs@gmail.com',
              'message': 'Authorized setup check for the SecurityByDesign contact form. If activation is needed, please send the activation email to the website owner.',
              '_subject': 'SecurityByDesign — contact form setup check',
              '_template': 'table',
              '_honey': '',
              '_url': origin + '/SecurityByDesign/',
          }
          request = urllib.request.Request(endpoint, data=json.dumps(payload).encode(), headers={
              'Content-Type': 'application/json', 'Accept': 'application/json',
              'User-Agent': 'SecurityByDesign/1.0', 'Origin': origin,
              'Referer': origin + '/SecurityByDesign/',
          })
          try:
              with urllib.request.urlopen(request, timeout=30) as response:
                  status, raw = response.status, response.read()
          except urllib.error.HTTPError as error:
              status, raw = error.code, error.read()
          try:
              result = json.loads(raw)
          except json.JSONDecodeError:
              result = {'message': 'The service returned a non-JSON response.'}
          evidence = {'status': status, 'success': result.get('success'), 'message': result.get('message')}
          print(json.dumps(evidence))
          print('::notice::Contact response ' + json.dumps(evidence).replace('%', '%25').replace('\n', '%0A').replace('\r', '%0D'))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write('Contact service response:\n\n```json\n' + json.dumps(evidence, indent=2) + '\n```\n')
          if status >= 400 or result.get('success') not in [True, 'true']:
              raise SystemExit(1)
